# Render Web Service — ImóvelFácil Backend (FastAPI)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: imovel-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Opcional: banco PostgreSQL/Supabase persistente.
      # Sem esta env, o backend usa SQLite local (recriado no startup com seed).
      - key: DATABASE_URL
        sync: false
