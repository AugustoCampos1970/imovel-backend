# Render Web Service — ImóvelFácil Backend (FastAPI)
services:
  - type: web
    name: imovel-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_SECONDS
        value: 86400
      # Configure uma URL PostgreSQL persistente no painel do Render.
      - key: DATABASE_URL
        sync: false
